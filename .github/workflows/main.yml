name: Deploy static site to Pages

on:
  push:
    branches: ["master"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Never cancel a deploy in flight. A scheduled feed refresh interrupting a
  # push deploy would leave the site on the older commit.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # The Letterboxd archive walk is ~40 paginated requests. It only needs to
      # run on the schedule; a push refreshes RSS and reuses committed history.
      - name: Refresh the Letterboxd feed and review archive
        run: node scripts/sync-external-feeds.mjs
        if: github.event_name != 'push'

      - name: Refresh the Letterboxd feed (RSS only)
        run: node scripts/sync-external-feeds.mjs --skip-archive
        if: github.event_name == 'push'

      - name: Build the blog from content/posts
        run: node scripts/build-blog.mjs

      - name: Check the markdown renderer
        run: node scripts/test-markdown.mjs

      - name: Validate site content
        run: node scripts/validate-content.mjs

      - name: Prepare the static artifact
        shell: bash
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.vscode/' \
            --exclude='.cursor/' \
            --exclude='.env' \
            --exclude='.DS_Store' \
            --exclude='AGENTS.md' \
            --exclude='README.md' \
            --exclude='scripts/' \
            --exclude='docs/' \
            --exclude='package.json' \
            --exclude='_site/' \
            ./ _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
