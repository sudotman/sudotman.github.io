<!--
  Paste inside <head> of the Blogspot theme (Blogger → Theme → Edit HTML).
  Generated by scripts/build-blog.mjs. Do not hand-edit; re-run npm run build.

  Blogger cannot issue a 301, so this sends readers and search engines to the
  canonical page at https://satyam.lol/blog/ using rel=canonical plus a client redirect.
-->
<script>
/*<![CDATA[*/
(function () {
  var moved = {
  "/2025/07/carcinization-on-internet.html": "https://satyam.lol/blog/carcinization-on-the-internet/",
  "/2024/03/political-discussion-and-debates-in.html": "https://satyam.lol/blog/political-discussion-in-the-attention-deficit-age/",
  "/2022/04/grimes-intersection-of-background.html": "https://satyam.lol/blog/grimes-and-dream-art-pop/",
  "/2022/03/absurdism-and-life.html": "https://satyam.lol/blog/absurdism-and-life/",
  "/2021/08/the-juxtaposition-of-societal.html": "https://satyam.lol/blog/dark-souls-3-power-and-society/"
  };
  var target = moved[location.pathname];
  if (!target) return;

  // Point the canonical at the new home before redirecting, so a crawler that
  // does not run the redirect still credits the right URL. Reuse the theme's
  // own canonical tag when it has one rather than adding a second.
  var canonical = document.querySelector('link[rel="canonical"]');
  if (!canonical) {
    canonical = document.createElement('link');
    canonical.rel = 'canonical';
    document.head.appendChild(canonical);
  }
  canonical.href = target;

  location.replace(target + location.hash);
})();
/*]]>*/
</script>
