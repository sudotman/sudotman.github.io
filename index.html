  <script>
    // The showreel plays once per tab, before the front door. It stays out of the way of
    // deep links, back-navigation, reduced motion and automation, and gives up rather than
    // hold the page if its script is slow to arrive. ?intro forces it.
    (() => {
      const root = document.documentElement;
      try {
        const forced = new URLSearchParams(location.search).has("intro");
        const nav = performance.getEntriesByType?.("navigation")[0];
        if (!forced && (sessionStorage.getItem("intro:seen") || location.hash || nav?.type === "back_forward" || navigator.webdriver || matchMedia("(prefers-reduced-motion: reduce)").matches)) return;
        sessionStorage.setItem("intro:seen", "1");
      } catch {
        return;
      }
      root.classList.add("intro");
      window.__introAuto = true;
      const giveUp = () => { if (!window.__introStarted) { window.__introCancelled = true; root.classList.remove("intro"); } };
      const script = document.createElement("script");
      script.src = "/js/intro.js?v=20260927b";
      script.onerror = giveUp;
      document.head.appendChild(script);
      setTimeout(giveUp, 1500);
    })();
  </script>
