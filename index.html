  <script>
    // The showreel is asked for, never imposed. [reel] in the entry nav plays it (js/landing.js);
    // /?intro, which is that link's own href and what the studio's preview opens, plays it on
    // arrival. Coming back to that address through history does not, and it gives up rather
    // than hold the page if its script is slow to arrive.
    (() => {
      const root = document.documentElement;
      try {
        if (!new URLSearchParams(location.search).has("intro")) return;
        if (performance.getEntriesByType?.("navigation")[0]?.type === "back_forward") return;
      } catch {
        return;
      }
      root.classList.add("intro");
      window.__introAuto = true;
      // The studio previewing an uncommitted reel config, this tab only.
      try {
        if (new URLSearchParams(location.search).has("studio-preview")) {
          const preview = JSON.parse(sessionStorage.getItem("satyam.studio.preview") || "");
          if (preview?.reel) window.__REEL_PREVIEW = preview.reel;
        }
      } catch {}
      const giveUp = () => { if (!window.__introStarted) { window.__introCancelled = true; root.classList.remove("intro"); } };
      // The config holds what the reel says; intro.js falls back to its own
      // copy without it. async = false keeps them in that order, since a
      // script created here is async by default.
      for (const src of ["/js/reel-config.js?v=20261023b", "/js/intro.js?v=20261111d"]) {
        const script = document.createElement("script");
        script.src = src;
        script.async = false;
        if (src.includes("intro.js")) script.onerror = giveUp;
        document.head.appendChild(script);
      }
      setTimeout(giveUp, 1500);
    })();
  </script>
